<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ page.description | default: site.seo_description }}">
  <meta name="author" content="Jinfan Frank Hu">
  <meta name="keywords" content="{% if page.tags %}{{ page.tags | join: ', ' }}, {% endif %}Jinfan Frank Hu, Phillips Academy, computational linguistics, AI research, NLP{% if page.layout == 'project' %}, programming projects{% endif %}">
  <meta name="robots" content="index, follow">

  <!-- Open Graph for LinkedIn, Facebook, Discord -->
  <meta property="og:title" content="{{ page.title | default: site.title | escape}}">
  <meta property="og:description" content="{{ page.description | default: site.seo_description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ page.image | default: '/images/ProfileCollage.jpg' }}">
  <meta property="og:image:alt" content="{% if page.image %}{{ page.title }}{% else %}{{ site.name }} - {{ site.header_description }}{% endif %}">
  <meta property="og:site_name" content="{{ site.name }}">
  {% if page.layout == 'post' %}<meta property="article:author" content="Jinfan Frank Hu">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {% if page.tags %}<meta property="article:tag" content="{{ page.tags | join: '", "' }}">{% endif %}{% endif %}

  <!-- Twitter Card (used by X, some Discord embeds) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape}}">
  <meta name="twitter:description" content="{{ page.description | default: site.seo_description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ page.image | default: '/images/preview.jpg' }}">
  <meta name="twitter:image:alt" content="{% if page.image %}{{ page.title }}{% else %}{{ site.name }} - {{ site.header_description }}{% endif %}">
  <meta name="twitter:site" content="@{{ site.footer-links.twitter | default: 'jinfanfrankhu' }}">
  <meta name="twitter:creator" content="@{{ site.footer-links.twitter | default: 'jinfanfrankhu' }}">

  <!-- Theme: apply saved preference before first paint to avoid flash -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Styles and favicon -->
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  <link rel="icon" href="{{ site.baseurl }}/favicon.png" type="image/png">
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- SEO -->
  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jinfan Frank Hu",
    "url": "{{ site.url }}",
    "description": "{{ site.seo_description }}",
    "image": "{{ site.url }}{{ site.avatar }}",
    "sameAs": [
      "https://github.com/jinfanfrankhu",
      "https://www.linkedin.com/in/jinfan-frank-hu"
    ],
    "jobTitle": "Student at Phillips Academy",
    "alumniOf": "Phillips Academy Andover"
  }
  </script>

  {% if page.layout == "post" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | default: site.seo_description | escape }}",
    "author": {
      "@type": "Person",
      "name": "Jinfan Frank Hu",
      "url": "{{ site.url }}"
    },
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.date | date_to_xmlschema }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.url }}{% if page.image %}{{ page.image }}{% else %}/images/preview.jpg{% endif %}",
      "width": 1200,
      "height": 630
    },
    "publisher": {
      "@type": "Person",
      "name": "Jinfan Frank Hu",
      "url": "{{ site.url }}"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    },
    "keywords": "{% if page.tags %}{{ page.tags | join: ', ' }}{% endif %}"
  }
  </script>
  {% endif %}

  {% if page.layout == "project" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | escape }}",
    "author": {
      "@type": "Person",
      "name": "Jinfan Frank Hu",
      "url": "{{ site.url }}"
    },
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.url }}{{ page.image }}",
      "width": 1200,
      "height": 630
    },
    "publisher": {
      "@type": "Person",
      "name": "Jinfan Frank Hu",
      "url": "{{ site.url }}"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    }
  }
  </script>
  {% endif %}
</head>
