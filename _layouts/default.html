<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" alt="{{ site.name }}" loading="lazy" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.header_description }}</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">Home</a>
            <a href="{{ site.baseurl }}/projects">Projects</a>
            <a href="{{ site.baseurl }}/posts">Posts</a>
            <a href="{{ site.baseurl }}/about">About Me</a>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">&#9790;</button>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}

    <script>
      (function() {
        var btn = document.getElementById('theme-toggle');
        var root = document.documentElement;

        function getTheme() {
          var saved = localStorage.getItem('theme');
          if (saved) return saved;
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
          root.setAttribute('data-theme', theme);
          btn.innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
          btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        }

        applyTheme(getTheme());

        btn.addEventListener('click', function() {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          localStorage.setItem('theme', next);
          applyTheme(next);
        });
      })();
    </script>
  </body>
</html>
