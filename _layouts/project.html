---
layout: default
---

<article class="project">
  <div class="post-header">
    <table style="width: 100%;">
      <tr>
        <td style="text-align: left; vertical-align: bottom;">
          <h1 class="post-title" itemprop="headline">{{ page.title }}</h1>
        </td>
        <td style="text-align: right; vertical-align: bottom; white-space: nowrap; font-size: 1rem;">
          <div class="post-meta" style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem;">
            <div class="post-views" id="viewcount">Loading views...</div>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <div class="entry">
    {{ content }}
  </div>
  <br><br><br>
  {% include disqus.html %}

  <script>
    const pagePath = window.location.pathname;
    fetch(`https://view-counter.jinfanfrankhu.workers.dev/?page=${encodeURIComponent(pagePath)}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("viewcount").innerText = `${data.views} views 👁️`;
      })
      .catch(err => {
        console.error("Failed to fetch view count:", err);
      });
  </script>
  
  <div class="back-link" style="margin-top: 20px;">
    <a href="{{ '/projects' | relative_url }}">&larr; Back to Projects</a>  </div>
</article>
