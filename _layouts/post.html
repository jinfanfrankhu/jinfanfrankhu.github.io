---
layout: default
---

<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <div class="post-header">
    <table style="width: 100%;">
      <tr>
        <td style="text-align: left; vertical-align: bottom;">
          <h1 class="post-title" itemprop="headline">{{ page.title }}</h1>
        </td>
        <td style="text-align: right; vertical-align: bottom; white-space: nowrap; font-size: 1rem;">
          <div class="post-meta">
            <div class="post-date">{{ page.date | date: "%B %e, %Y" }}</div>
            <div class="post-views" id="viewcount">Loading views...</div>
          </div>
        </td>
      </tr>
    </table>
  </div>


  <hr class="project-divider">

  <div class="entry" itemprop="articleBody">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="post-tags" style="margin-top: 10px;">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="{{ '/posts/?tag=' | append: tag | relative_url }}" class="tag-link">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
  {% endif %}

  <div class="back-link" style="margin-top: 20px;">
    <a href="{{ '/posts' | relative_url }}">&larr; Back to Posts</a>
  </div>

  <br><br><br>

  {% include disqus.html %}

  <script>
    const pagePath = window.location.pathname;
    fetch(`https://view-counter.jinfanfrankhu.workers.dev/?page=${encodeURIComponent(pagePath)}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("viewcount").innerText = `${data.views} views 👁️`;
      })
      .catch(err => {
        console.error("Failed to fetch view count:", err);
      });
  </script>

  <meta itemprop="author" content="Jinfan Frank Hu" />
</article>
