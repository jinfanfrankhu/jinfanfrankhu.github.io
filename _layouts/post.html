---
layout: default
---

<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <h1 itemprop="headline">{{ page.title }}</h1>

  <p>
    <span id="view-count">Loading views...</span>
  </p>

  <div class="entry" itemprop="articleBody">
    {{ content }}
  </div>

  <div class="date">
    Written on <time itemprop="datePublished" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %e, %Y" }}</time>
  </div>

  {% if page.tags %}
  <div class="post-tags" style="margin-top: 10px;">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="{{ '/posttags/?tag=' | append: tag | relative_url }}" class="tag-link">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
  {% endif %}

  <div class="back-link" style="margin-top: 20px;">
    <a href="{{ '/posts' | relative_url }}">&larr; Back to Posts</a>
  </div>

  <br><br><br>

  {% include disqus.html %}

  <meta itemprop="author" content="Jinfan Frank Hu" />
</article>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const page = window.location.pathname;
    const viewCountEl = document.getElementById("view-count");

    fetch(`https://counter.dev/0774af18-d684-4b1e-bd2e-b77747a4fc61/slug${page}`)
      .then(response => response.json())
      .then(data => {
        if (data && typeof data.count === "number") {
          viewCountEl.textContent = `${data.count} views`;
        } else {
          viewCountEl.textContent = `No views`;
        }
      })
      .catch(() => {
        viewCountEl.textContent = `Error loading views`;
      });
  });
</script>
