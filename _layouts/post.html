---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% if page.tags %}
  <div class="post-tags" style="margin-top: 10px;">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="{{ '/posttags/?tag=' | append: tag | relative_url }}" class="tag-link">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
  {% endif %}

  <div class="back-link" style="margin-top: 20px;">
    <a href="{{ '/posts' | relative_url }}">&larr; Back to Posts</a>  </div>
  </div>

  <br><br><br>

  {% include disqus.html %}

</article>
