---
layout: default
---

<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <h1 itemprop="headline">{{ page.title }}</h1>

  <div class="entry" itemprop="articleBody">
    {{ content }}
  </div>

  <div class="date">
    Written on <time itemprop="datePublished" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %e, %Y" }}</time>
  </div>

  {% if page.tags %}
  <div class="post-tags" style="margin-top: 10px;">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <a href="{{ '/posts/?tag=' | append: tag | relative_url }}" class="tag-link">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
  {% endif %}

  <div class="back-link" style="margin-top: 20px;">
    <a href="{{ '/posts' | relative_url }}">&larr; Back to Posts</a>
  </div>

  <br><br><br>

  {% include disqus.html %}

  <span id="viewcount">Loading views...</span>

  <script>
    const pagePath = window.location.pathname;

    fetch(`https://view-counter.jinfanfrankhu.workers.dev/?page=${encodeURIComponent(pagePath)}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("viewcount").innerText = `${data.views} views`;
      })
      .catch(err => {
        console.error("Failed to fetch view count:", err);
      });
  </script>

  <meta itemprop="author" content="Jinfan Frank Hu" />
</article>
